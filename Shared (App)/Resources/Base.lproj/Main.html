<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="GlossX Icon">
    <h1>GlossX</h1>
    <p class="intro">在日常浏览中自然嵌入英文词，用 SM-2 间隔重复巩固词汇记忆。</p>
    <p class="privacy-note">安装后请完成三步：① 在 Safari 设置中启用本扩展；② 将「网站访问权限」设为「允许」或「允许全部」；③ 在工具栏 popup 中开启总开关并启用当前网站。</p>
    <p class="platform-ios">请在「设置 → Safari → 扩展」中启用 GlossX。</p>
    <p class="platform-mac state-unknown">请在 Safari 扩展偏好设置中启用 GlossX。</p>
    <p class="platform-mac state-on">GlossX 扩展已启用。可在 Safari 扩展偏好设置中关闭。</p>
    <p class="platform-mac state-off">GlossX 扩展未启用。请在 Safari 扩展偏好设置中打开。</p>
    <button class="platform-mac open-preferences">退出并打开 Safari 扩展设置…</button>
</body>
</html>
